<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECF0EB">
<script>
  // LINE Developers で発行した LIFF ID をここに入れてください（例: "2001234567-AbCdEfGh"）
  window.LIFF_ID = "2012233396-7JToRRVE";
</script>
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>ANATOMIA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 解剖図版（プレート）が主役。その横か下に「読む」カード。下部タブで 人体図・クイズ・カード・語源 を切り替える */
:root{
  --paper:#ECF0EB; --panel:#F8FAF6; --sunk:#E0E7E1; --grid:#E1E8E2;
  --ink:#1C2838; --ink-2:#506070; --rule:#C6D0C8;
  --accent:#2B675E; --on-accent:#FFFFFF;
  --body:#D8E0D9; --body-edge:#98A69D;
  --bone:#A27427; --bone-fill:#EEE1C0; --muscle:#AF3F59; --organ:#744F88; --nv:#2A67AA;
  --artery:#BF402E; --vein:#3961AF; --nerve:#B5810D; --lymph:#3A8758;
  --good:#2C7848; --good-bg:#E1F0E5; --bad:#B23838; --bad-bg:#F6E1E0;
  --c-bone:#8A7660; --c-joint:#5B7A2B; --c-muscle:#AF3F59; --c-organ:#744F88; --c-nerve:#B88600; --c-vessel:#2A67AA;
  --ligament:#6E8B3D; --cartilage:#6F9FB4; --fat:#D9BC5E; --tendon:#A9A28F; --brain:#C79AA3;
  --f-latin:"Cormorant Garamond","Iowan Old Style","Times New Roman",serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111821; --panel:#18212C; --sunk:#202B38; --grid:#1B2430;
  --ink:#E3E8EE; --ink-2:#A1AEBC; --rule:#2D3A49;
  --accent:#6DC0B1; --on-accent:#0E1A19;
  --body:#243140; --body-edge:#42546A;
  --bone:#D6B068; --bone-fill:#3A3324; --muscle:#E07A90; --organ:#B48ACA; --nv:#76A6E5;
  --artery:#E86F5C; --vein:#7A9DE5; --nerve:#E2B646; --lymph:#6ABF8A;
  --good:#6BC48A; --good-bg:#16301F; --bad:#EE7B7B; --bad-bg:#3A1C1E;
  --c-bone:#C2AE95; --c-joint:#A6C46A; --c-muscle:#E07A90; --c-organ:#B48ACA; --c-nerve:#E4B53A; --c-vessel:#76A6E5;
  --ligament:#A8C46F; --cartilage:#8DBBD0; --fat:#B79A45; --tendon:#8F887A; --brain:#A87882;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111821; --panel:#18212C; --sunk:#202B38; --grid:#1B2430;
  --ink:#E3E8EE; --ink-2:#A1AEBC; --rule:#2D3A49;
  --accent:#6DC0B1; --on-accent:#0E1A19;
  --body:#243140; --body-edge:#42546A;
  --bone:#D6B068; --bone-fill:#3A3324; --muscle:#E07A90; --organ:#B48ACA; --nv:#76A6E5;
  --artery:#E86F5C; --vein:#7A9DE5; --nerve:#E2B646; --lymph:#6ABF8A;
  --good:#6BC48A; --good-bg:#16301F; --bad:#EE7B7B; --bad-bg:#3A1C1E;
  --c-bone:#C2AE95; --c-joint:#A6C46A; --c-muscle:#E07A90; --c-organ:#B48ACA; --c-nerve:#E4B53A; --c-vessel:#76A6E5;
  --ligament:#A8C46F; --cartilage:#8DBBD0; --fat:#B79A45; --tendon:#8F887A; --brain:#A87882;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-jp);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,[role=button]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(92px + env(safe-area-inset-bottom,0px))}
.latin{font-family:var(--f-latin)}
.muted{color:var(--ink-2)}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-block:4px 10px;border-bottom:1px solid var(--rule)}
.brand{margin:0;line-height:1}
.brand-name{display:block;font-family:var(--f-latin);font-weight:600;font-size:30px;letter-spacing:.24em;margin-right:-.24em;color:var(--ink)}
.brand-sub{display:block;margin-top:6px;font-size:11.5px;font-weight:500;letter-spacing:.1em;color:var(--ink-2)}
.meter{display:flex;gap:14px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.meter b{display:block;font-size:17px;color:var(--ink);font-weight:700;line-height:1.1}
.view{margin-top:14px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;color:var(--ink-2);margin:0 0 6px;font-weight:500}
h2.sect{font-size:19px;margin:0 0 4px;letter-spacing:.03em}
.lead{margin:0 0 14px;color:var(--ink-2);font-size:13.5px}

/* atlas */
.atlas{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.atlas > div{min-width:0}
@media (min-width:780px){.atlas{grid-template-columns:minmax(320px,400px) minmax(0,1fr);align-items:start}}
.controls{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{border:0;background:none;color:var(--ink-2);font-size:13px;padding:5px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.layers{display:flex;flex-wrap:wrap;gap:6px}
.layer-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--panel);font-size:13.5px;padding:5px 11px;border-radius:7px;cursor:pointer}
.layer-chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.layer-chip[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);font-weight:700}
.plate{position:relative;border:1px solid var(--rule);border-radius:4px;background-color:var(--panel);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;background-position:-1px -1px;padding:8px 6px 6px}
.plate svg{display:block;margin:0 auto;max-width:100%;touch-action:manipulation}
.plates-scroll{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 10px;padding-bottom:2px;scrollbar-width:thin}
.plates{display:flex;gap:6px;width:max-content}
.plate-chip{border:1px solid var(--rule);background:var(--panel);font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.plate-chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.plate-chip.sm{font-size:12px;padding:3px 10px}
.plate-cap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 10px;padding:2px 6px 0;font-size:11.5px;color:var(--ink-2)}
.plate-cap em{font-family:var(--f-latin);font-size:15px;min-width:0;overflow-wrap:anywhere}
.plate-name{position:absolute;left:10px;top:8px;max-width:58%;font-family:var(--f-latin);font-weight:600;font-size:17px;line-height:1.15;color:var(--ink);pointer-events:none}
.plate-name small{display:block;font-family:var(--f-jp);font-weight:500;font-size:11.5px;color:var(--ink-2)}

/* term panel */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:16px 18px;min-width:0}
.tp-cat{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;color:var(--ink-2)}
.tp-cat i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tp-head{display:flex;align-items:center;gap:10px;margin-top:4px}
.tp-en{margin:0;font-family:var(--f-latin);font-weight:600;font-size:clamp(30px,8vw,42px);line-height:1.05;overflow-wrap:anywhere;min-width:0}
.speak{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);color:var(--accent);display:inline-grid;place-items:center;cursor:pointer;padding:0}
.speak svg{width:18px;height:18px}
.speak.sm{width:30px;height:30px}.speak.sm svg{width:15px;height:15px}
.no-tts .speak{display:none}
.tp-pron{margin-top:4px;font-size:14px;color:var(--ink-2)}
.tp-pron .k{color:var(--ink);letter-spacing:.02em}
.tp-pron .k b{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.tp-alt{font-family:var(--f-latin);font-style:italic;font-size:16px;color:var(--ink-2)}
.tp-ja{margin-top:8px;font-size:21px;font-weight:700;line-height:1.35}
.tp-ja small{font-size:13px;font-weight:400;color:var(--ink-2);margin-left:8px}
.sec{margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule)}
.sec h3{margin:0 0 6px;font-size:11.5px;letter-spacing:.16em;color:var(--ink-2);font-weight:500}
.sec p{margin:0}
.root-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.root-chip{font-family:var(--f-mono);font-size:12.5px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:4px;padding:2px 8px;cursor:pointer}
.root-chip span{font-family:var(--f-jp);margin-left:4px;color:var(--ink-2)}
.ex{display:flex;gap:8px;align-items:flex-start}
.ex-en{font-family:var(--f-latin);font-size:19px;font-weight:500;line-height:1.35}
.ex-ja{margin-top:4px;font-size:13.5px;color:var(--ink-2)}
.tip{margin-top:14px;background:var(--sunk);border-radius:4px;padding:9px 12px;font-size:13.5px}
.tip b{font-size:11.5px;letter-spacing:.12em;color:var(--ink-2);margin-right:8px;font-weight:500}
.status{margin-top:12px;font-size:12px;color:var(--ink-2)}
.term-list-wrap{margin-top:14px}
.term-list{display:flex;flex-wrap:wrap;gap:6px}
.term-chip{font-family:var(--f-latin);font-size:16px;font-weight:600;border:1px solid var(--rule);background:var(--panel);padding:2px 10px 3px;border-radius:999px;cursor:pointer;line-height:1.4}
.term-chip small{font-family:var(--f-jp);font-size:10.5px;font-weight:400;color:var(--ink-2);margin-left:5px}
.term-chip[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.term-chip[aria-current="true"] small{color:var(--paper)}

/* svg markers */
.mk{cursor:pointer;outline:none}
.mk .hit{fill:transparent}
.mk .dot{stroke:var(--panel);stroke-width:1.6px;vector-effect:non-scaling-stroke}
.mk:focus-visible .dot{stroke:var(--ink);stroke-width:2.4px}
.mk .ring{fill:none;stroke-width:1.8px;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{opacity:.95;transform:scale(.55)}100%{opacity:0;transform:scale(1.6)}}

/* quiz */
.narrow{max-width:680px}
.label{font-size:12.5px;font-weight:700;margin:0 0 8px;letter-spacing:.04em}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mode{text-align:left;border:1px solid var(--rule);background:var(--panel);padding:11px 13px;border-radius:6px;cursor:pointer;min-width:0}
.mode b{display:block;font-size:15px}
.mode span{display:block;font-size:12px;color:var(--ink-2);line-height:1.5;margin-top:2px}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mode[aria-pressed="true"] b{color:var(--accent)}
.ranges{display:flex;flex-wrap:wrap;gap:6px}
.range{border:1px solid var(--rule);background:var(--panel);font-size:13.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.range[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.stack{display:grid;gap:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);font-weight:700;font-size:15px;padding:11px 20px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.qtop{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.qbar{flex:1;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent)}
.qquit{border:0;background:none;color:var(--ink-2);font-size:12.5px;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.prompt{margin:14px 0 12px;padding:18px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;text-align:center}
.prompt .ask{font-size:13px;color:var(--ink-2)}
.prompt .big{font-size:clamp(28px,8vw,40px);font-weight:700;line-height:1.2;margin:4px 0;overflow-wrap:anywhere}
.prompt .big.latin{font-weight:600}
.prompt .big mark{background:none;color:var(--accent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.prompt .mini{display:flex;justify-content:center}
.prompt .mini svg{max-width:100%}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--rule);background:var(--panel);padding:11px 14px;border-radius:8px;cursor:pointer;font-size:16px;min-height:50px}
.opt.en{font-family:var(--f-latin);font-size:21px;font-weight:600}
.opt .mark{font-family:var(--f-jp);font-size:12px;font-weight:700}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.correct .mark{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .mark{color:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.feedback{margin-top:12px;padding:14px 16px;border-radius:6px;border:1px solid var(--rule);background:var(--panel)}
.feedback .fb-h{font-weight:700;font-size:14px}
.feedback .fb-h.ok{color:var(--good)} .feedback .fb-h.ng{color:var(--bad)}
.fb-term{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.fb-term .latin{font-size:24px;font-weight:600}
.fb-ety{margin:6px 0 0;font-size:13.5px;color:var(--ink-2)}
.next{margin-top:12px;width:100%}
.result{text-align:center;padding:22px 16px;background:var(--panel);border:1px solid var(--rule);border-radius:6px}
.score{font-family:var(--f-latin);font-size:64px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:28px;color:var(--ink-2)}
.miss{margin-top:16px}
.history{font-size:12.5px;color:var(--ink-2)}

/* cards */
.cardbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.counts{display:flex;gap:14px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.counts b{font-size:18px;color:var(--ink);display:block;line-height:1.1}
.flash{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:280px;padding:26px 20px;text-align:center;background:var(--panel);border:1px solid var(--rule);border-radius:10px;cursor:pointer;user-select:none;-webkit-user-select:none}
.flash .fl-cat{position:absolute;top:12px;left:14px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.flash .fl-cat i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.flash .fl-box{position:absolute;top:12px;right:14px;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.flash .fl-main{font-size:clamp(30px,9vw,44px);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.flash .fl-main.latin{font-weight:600}
.flash .fl-hint{font-size:12px;color:var(--ink-2);margin-top:10px}
.flash .fl-back{width:100%;max-width:460px;margin-top:10px;padding-top:12px;border-top:1px dashed var(--rule);text-align:left;font-size:13.5px}
.flash .fl-back .ex-en{font-size:17px}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.grade{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.grade b{font-size:15px}
.grade small{font-size:11.5px;color:var(--ink-2)}
.grade.again{border-color:var(--bad)} .grade.again b{color:var(--bad)}
.grade.good{border-color:var(--good)} .grade.good b{color:var(--good)}
.boxes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:18px}
.boxes div{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:6px 2px;text-align:center;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.boxes b{display:block;font-size:16px;color:var(--ink)}
.done{text-align:center;padding:30px 16px;background:var(--panel);border:1px solid var(--rule);border-radius:10px}
.done h3{margin:0 0 6px;font-size:18px}

/* roots */
.search{width:100%;max-width:420px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;margin-bottom:14px}
.roots-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.root-card{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;min-width:0}
.root-card.focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rc-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.rc-r{font-family:var(--f-mono);font-size:16px;color:var(--accent)}
.rc-m{font-weight:700;font-size:16px}
.rc-o{font-size:12px;color:var(--ink-2);margin-top:2px}
.rc-w{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:13.5px}
.rc-w .latin{font-size:17px;font-weight:600;margin-right:6px}
.rc-note{margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.rc-terms{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.rc-terms .term-chip{font-size:14.5px}
.empty{color:var(--ink-2);font-size:14px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--rule);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{border:0;background:none;color:var(--ink-2);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}

@media (prefers-reduced-motion: reduce){.mk .ring{animation:none;opacity:.7;transform:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <h1 class="brand"><span class="brand-name">ANATOMIA</span><span class="brand-sub">アナトミア ── 英語で読む、からだの地図</span></h1>
    <div class="meter" id="meter" aria-live="polite"></div>
  </header>

  <!-- 人体図 -->
  <section class="view" id="v-atlas" aria-label="図">
    <div class="atlas">
      <div>
        <div class="layers" id="cats" role="group" aria-label="分野"></div>
        <div class="plates-scroll"><div class="plates" id="plates" role="group" aria-label="図"></div></div>
        <figure class="plate" id="plateBox" style="margin:0">

<script>
/* ---- src/core.js ---- */
/* =====================================================================
   からだ英語アトラス — core（共通の土台）
   ・分野（CAT）、単語・語根・図版の登録関数
   ・SVG描画のヘルパー、全身シルエット、図版の描画エンジン
   各分野ファイル（src/cat/*.js）は addTerms / addRoots / addPlates を呼ぶだけ。
   ===================================================================== */

var CAT = {
  bone:   {ja:'骨',         en:'Bones',              c:'var(--c-bone)'},
  joint:  {ja:'関節・靭帯', en:'Joints & Ligaments', c:'var(--c-joint)'},
  muscle: {ja:'筋肉',       en:'Muscles',            c:'var(--c-muscle)'},
  organ:  {ja:'臓器・器官', en:'Organs',             c:'var(--c-organ)'},
  nerve:  {ja:'脳・神経',   en:'Nervous system',     c:'var(--c-nerve)'},
  vessel: {ja:'血管・リンパ', en:'Vessels & Lymph',  c:'var(--c-vessel)'}
};
var CAT_ORDER = ['bone', 'joint', 'muscle', 'organ', 'nerve', 'vessel'];

var TERMS = [], ROOTS = [], PLATES = [];
function addTerms(list){ for(var i=0;i<list.length;i++) TERMS.push(list[i]); }
function addRoots(list){
  for(var i=0;i<list.length;i++){
    var r = list[i], dup = false;
    for(var j=0;j<ROOTS.length;j++) if(ROOTS[j].id === r.id){ dup = true; break; }
    if(!dup) ROOTS.push(r);
  }
}
function addPlates(list){ for(var i=0;i<list.length;i++) PLATES.push(list[i]); }

/* 既存の基本語（terms-core.js）の位置 x,y,view から全身図の点を作る */
function corePins(cat, view){
  return TERMS.filter(function(t){ return t.cat === cat && t.view === view && t.x != null; })
              .map(function(t){ return [t.id, t.x, t.y]; });
}

/* ---------- SVG ヘルパー ---------- */
var SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, a, p){
  var e = document.createElementNS(SVG_NS, tag);
  for(var k in a){ if(a[k] !== undefined && a[k] !== null) e.setAttribute(k, a[k]); }
  if(p) p.appendChild(e);
  return e;
}
function ext(){ var o = {}; for(var i=0;i<arguments.length;i++){ var s = arguments[i]; for(var k in s) o[k] = s[k]; } return o; }
/* パスを左右反転（x → 2*axis - x）。絶対座標の M L C Q S T と Z のみ対応（H V A や小文字は不可） */
function mirrorPath(d, axis){
  axis = (axis == null) ? 120 : axis;
  return d.replace(/([MLCQST])([^A-Za-z]*)/g, function(m, c, args){
    var v = args.trim().split(/[\s,]+/).filter(Boolean).map(Number), o = [];
    for(var i=0;i<v.length;i+=2) o.push(+(2*axis - v[i]).toFixed(2), v[i+1]);
    return c + o.join(' ') + ' ';
  });
}

/* ---------- 全身シルエット（座標系 240 x 506、画面の左＝からだの右） ---------- */
var BODY = {
  TORSO: 'M120 92 C140 92 158 96 166 106 C172 116 168 140 164 160 C160 190 154 210 154 232 C156 250 164 268 164 286 C164 300 150 306 120 306 C90 306 76 300 76 286 C76 268 84 250 86 232 C86 210 80 190 76 160 C72 140 68 116 74 106 C82 96 100 92 120 92 Z',
  LEG: 'M77 282 C76 310 80 360 86 388 C84 405 83 430 91 472 C90 480 86 488 88 494 C92 500 112 500 113 494 C114 488 110 480 110 472 C116 440 118 408 114 388 C118 360 121 320 121 296 Z',
  ARMS: [[74,112,62,200,24],[62,200,52,285,19]]
};
function drawSilhouette(svg, edge, ew){
  [true, false].forEach(function(out){
    var g = svgEl('g', {}, svg), f = out ? edge : 'var(--body)';
    var sa = out ? {fill:f, stroke:f, 'stroke-width':ew*2, 'stroke-linejoin':'round'} : {fill:f};
    svgEl('ellipse', ext({cx:120, cy:44, rx:26, ry:33}, sa), g);
    svgEl('rect', ext({x:108, y:66, width:24, height:34, rx:6}, sa), g);
    svgEl('path', ext({d:BODY.TORSO}, sa), g);
    svgEl('path', ext({d:BODY.LEG}, sa), g);
    svgEl('path', ext({d:mirrorPath(BODY.LEG)}, sa), g);
    BODY.ARMS.forEach(function(s){
      var la = {fill:'none', stroke:f, 'stroke-width': out ? s[4]+ew*2 : s[4], 'stroke-linecap':'round'};
      svgEl('line', ext({x1:s[0], y1:s[1], x2:s[2], y2:s[3]}, la), g);
      svgEl('line', ext({x1:240-s[0], y1:s[1], x2:240-s[2], y2:s[3]}, la), g);
    });
    svgEl('ellipse', ext({cx:50, cy:303, rx:9, ry:18, transform:'rotate(7 50 303)'}, sa), g);
    svgEl('ellipse', ext({cx:190, cy:303, rx:9, ry:18, transform:'rotate(-7 190 303)'}, sa), g);
  });
}
function drawBodyDetails(svg, view, px){
  var a = {fill:'none', stroke:'var(--body-edge)', 'stroke-width':0.9*px, 'stroke-linecap':'round', opacity:0.75};
  if(view === 'f'){ svgEl('circle', ext({cx:120, cy:240, r:1.6}, a), svg); }
  else {
    svgEl('path', ext({d:'M120 104 L120 254', 'stroke-dasharray':(2*px)+' '+(3*px)}, a), svg);
    svgEl('path', ext({d:'M120 266 L120 300'}, a), svg);
    svgEl('path', ext({d:'M84 300 Q100 307 117 302'}, a), svg);
    svgEl('path', ext({d:mirrorPath('M84 300 Q100 307 117 302')}, a), svg);
  }
}

/* ---------- 図版を描くときに art(h) へ渡す道具 ----------
   h.px = 画面1ピクセルぶんの座標の長さ。線の太さは「1.5*h.px」のように書く。
   h.on(id) = その単語が選択中か。選択中の部分は h.F / h.L が自動で強調する。 */
function makeHelper(g, sel, px){
  var h = {g:g, sel:sel, px:px};
  h.on = function(id){
    if(!sel) return false;
    if(Array.isArray(id)) return id.indexOf(sel) >= 0;
    return id === sel;
  };
  h.n = function(tag, a, p){ return svgEl(tag, a || {}, p || g); };
  h.group = function(a, p){ return svgEl('g', a || {}, p || g); };
  h.path = function(d, a, p){ return svgEl('path', ext({d:d}, a), p || g); };
  h.pair = function(d, a, axis, p){ h.path(d, a, p); h.path(mirrorPath(d, axis), a, p); };
  h.ellipse = function(cx, cy, rx, ry, rot, a, p){
    return svgEl('ellipse', ext({cx:cx, cy:cy, rx:rx, ry:ry, transform: rot ? 'rotate('+rot+' '+cx+' '+cy+')' : null}, a), p || g);
  };
  h.pairEllipse = function(cx, cy, rx, ry, rot, a, axis, p){
    axis = (axis == null) ? 120 : axis;
    h.ellipse(cx, cy, rx, ry, rot, a, p);
    if(cx !== axis) h.ellipse(2*axis - cx, cy, rx, ry, rot ? -rot : 0, a, p);
  };
  h.circle = function(cx, cy, r, a, p){ return svgEl('circle', ext({cx:cx, cy:cy, r:r}, a), p || g); };
  h.pairCircle = function(cx, cy, r, a, axis, p){ axis = (axis == null) ? 120 : axis; h.circle(cx, cy, r, a, p); h.circle(2*axis - cx, cy, r, a, p); };
  h.rect = function(x, y, w, hh, rx, a, p){ return svgEl('rect', ext({x:x, y:y, width:w, height:hh, rx:rx || 0}, a), p || g); };
  /* 選択できる面：fill の色 col、ふだんの濃さ op（既定0.22） */
  h.F = function(id, col, op){
    var on = h.on(id);
    return {fill:col, 'fill-opacity': on ? 0.6 : (op == null ? 0.22 : op), stroke: on ? 'var(--ink)' : col, 'stroke-width': (on ? 1.8 : 1) * px, 'stroke-linejoin':'round'};
  };
  /* 選択できる線：太さ wpx はピクセル指定 */
  h.L = function(id, col, wpx){
    var on = h.on(id), w = (wpx == null) ? 1.5 : wpx;
    return {fill:'none', stroke: on ? 'var(--ink)' : col, 'stroke-width': (on ? w + 1.6 : w) * px, 'stroke-linecap':'round', 'stroke-linejoin':'round'};
  };
  /* 選択とは関係のない線・面 */
  h.S = function(col, wpx, extra){ return ext({fill:'none', stroke:col, 'stroke-width':(wpx == null ? 1 : wpx) * px, 'stroke-linecap':'round', 'stroke-linejoin':'round'}, extra || {}); };
  h.Fill = function(col, op, extra){ return ext({fill:col, 'fill-opacity': op == null ? 0.22 : op, stroke:col, 'stroke-width':px, 'stroke-linejoin':'round'}, extra || {}); };
  /* 向きなどの小さな注記（用語名は書かない） */
  h.text = function(x, y, s, a){
    var t = svgEl('text', ext({x:x, y:y, 'font-size':11*px, fill:'var(--ink-2)', 'font-family':'var(--f-latin)'}, a), g);
    t.textContent = s; return t;
  };
  return h;
}

/* ---------- 図版の描画 ----------
   o = {sel, only, interactive, maxW, maxH, debug} */
function drawPlate(svg, plate, o){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  var vb = plate.vb;
  var ppu = Math.min(o.maxW / vb[2], o.maxH / vb[3]);
  var px = 1 / ppu;
  svg.setAttribute('viewBox', vb.join(' '));
  svg.style.width = Math.round(vb[2] * ppu) + 'px';
  svg.style.height = Math.round(vb[3] * ppu) + 'px';
  if(plate.base){
    var skin = o.sel === 'skin';
    drawSilhouette(svg, skin ? 'var(--organ)' : 'var(--body-edge)', (skin ? 2.2 : 1.1) * Math.max(px, 0.9));
    drawBodyDetails(svg, plate.base, Math.max(px, 0.9));
  }
  var art = svgEl('g', {}, svg);
  if(plate.art){
    try { plate.art(makeHelper(art, o.sel, px)); }
    catch(e){ if(window.console) console.error('plate art error', plate.id, e); }
  }
  drawMarkers(svg, plate, o, px);
}

var TERM_INDEX = null;
function termById(id){
  if(!TERM_INDEX){ TERM_INDEX = {}; TERMS.forEach(function(t){ TERM_INDEX[t.id] = t; }); }
  return TERM_INDEX[id];
}
function drawMarkers(svg, plate, o, px){
  var pins = (plate.pins || []).filter(function(p){ return termById(p[0]) && (!o.only || p[0] === o.sel); });
  pins.sort(function(a, b){ return (a[0] === o.sel) - (b[0] === o.sel); });
  pins.forEach(function(p){
    var t = termById(p[0]), on = p[0] === o.sel, col = CAT[t.cat].c;
    var g = svgEl('g', {'class':'mk' + (on ? ' on' : ''), 'data-id':t.id}, svg);
    if(o.interactive){ g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); g.setAttribute('aria-label', t.en + '（' + t.ja + '）'); }
    svgEl('circle', {'class':'hit', cx:p[1], cy:p[2], r:13*px}, g);
    if(on) svgEl('circle', {'class':'ring', cx:p[1], cy:p[2], r:10*px, stroke:col}, g);
    svgEl('circle', {'class':'dot', cx:p[1], cy:p[2], r:(on ? 6.6 : 4.8)*px, fill: on ? 'var(--ink)' : col}, g);
    if(on) svgEl('circle', {cx:p[1], cy:p[2], r:2.6*px, fill:col, 'pointer-events':'none'}, g);
    if(o.debug){
      var tx = svgEl('text', {x:p[1] + 7*px, y:p[2] + 3.5*px, 'font-size':10*px, fill:'var(--ink)', 'font-family':'monospace', 'paint-order':'stroke', stroke:'var(--panel)', 'stroke-width':3*px}, svg);
      tx.textContent = p[0];
    }
  });
}

function sym(start, segs, ax){
  ax = (ax == null) ? 150 : ax;
  var d = 'M' + start.join(' '), pts = [start];
  segs.forEach(function(s){ d += ' C' + s.join(' '); pts.push([s[4], s[5]]); });
  for(var i = segs.length - 1; i >= 0; i--){
    var s = segs[i], p = pts[i];
    d += ' C' + [2*ax - s[2], s[3], 2*ax - s[0], s[1], 2*ax - p[0], p[1]].join(' ');
  }
  return d + ' Z';
}

  return {fill:'var(--body-edge)', 'fill-opacity': on ? 0.95 : (op == null ? 0.7 : op), stroke: on ? 'var(--ink)' : 'var(--bone)', 'stroke-width': (on ? 2.2 : 0.9) * h.px, 'stroke-linejoin':'round'};
}
/* 骨の一部分（ふだんは境界線を描かず、選択時だけ強調） */
function part(h, id, op){
  var a = h.F(id, 'var(--bone)', op == null ? 0 : op);
  if(!h.on(id)) a.stroke = 'none';
  return a;
}
/* 骨の地（選択と無関係） */
function boneBase(h, op){ return {fill:'var(--bone-fill)', 'fill-opacity': op == null ? 1 : op, stroke:'var(--bone)', 'stroke-width':1.3*h.px, 'stroke-linejoin':'round'}; }

/* 関節・靭帯 */
(function(){

/* ---------- 共通の描き方 ---------- */
var BONE = 'var(--bone)', BFILL = 'var(--bone-fill)', LIG = 'var(--ligament)', CART = 'var(--cartilage)';
/* 骨（面）: 地として淡く */
function B(h, op){ return {fill:BFILL, 'fill-opacity': op == null ? 1 : op, stroke:BONE, 'stroke-width':1.1*h.px, 'stroke-linejoin':'round'}; }
/* 骨（線）: 全身図の淡い骨格 */
function BL(h, w, op){ return h.S(BONE, w == null ? 1.3 : w, {'stroke-opacity': op == null ? 0.5 : op}); }
/* 関節の目印（全身図） */
function jm(h, id, x, y, r){ h.circle(x, y, r, h.F(id, LIG, 0.28)); }
function jm2(h, id, x, y, r){ jm(h, id, x, y, r); jm(h, id, 240 - x, y, r); }
/* 靭帯の帯（太い線） */
function band(h, id, d, wpx){ h.path(d, h.L(id, LIG, wpx == null ? 5 : wpx)); }

/* ---------- 全身図 ---------- */
function artBody(h, view){
  var f = view === 'f';
  /* 淡い骨格 */
  h.ellipse(120, 40, 21, 26, 0, BL(h, 1.1, 0.45));

  var top = f ? 82 : 70, bot = f ? 97 : 240;

  if(f){
    for(var ly = 176; ly <= 236; ly += 12) h.rect(113.5, ly, 13, 9, 2.5, h.Fill(BONE, 0.14, {'stroke-opacity':0.45}));
    h.pair('M117 101 Q100 97 84 106', BL(h, 2.2));
    h.rect(116.5, 104, 7, 50, 3, h.Fill(BONE, 0.12, {'stroke-opacity':0.45}));
    for(var i = 0; i < 6; i++){ var ry = 112 + i * 9; h.pair('M116 '+ry+' C100 '+(ry-5)+' 86 '+(ry+1)+' 85 '+(ry+13+i*1.4), BL(h, 1, 0.3)); }
  } else {
    h.pair('M85 112 L113 119 L104 170 Z', h.Fill(BONE, 0.1, {'stroke-opacity':0.45}));
    h.pair('M87 117 L111 123', BL(h, 1.1, 0.45));

  else h.pairEllipse(100, 489, 6.5, 5.5, 0, BL(h, 1, 0.45));

  /* 関節の目印 */
  if(f){
    jm2(h, 'tmj', 99, 55, 4);
    jm2(h, 'sternoclavicular_joint', 114, 103, 4);
    jm2(h, 'acromioclavicular_joint', 85, 106, 3.6);
    jm(h, 'pubic_symphysis', 120, 294, 4.2);
  } else {
    jm(h, 'atlantooccipital_joint', 120, 68, 4.5);
    for(var k = 0; k < 6; k++) jm2(h, 'costovertebral_joint', 113, 114 + k * 12, 2.6);
    h.pair('M110 250 L107 268', h.L('sacroiliac_joint', LIG, 3.2));
    jm2(h, 'subtalar_joint', 100, 485, 3.4);
  }
  jm2(h, 'shoulder_joint', 77, 116, 6);
  jm2(h, 'elbow_joint', 62, 201, 5.5);
  if(f){ jm2(h, 'proximal_radioulnar_joint', 60, 210, 3); jm2(h, 'distal_radioulnar_joint', 53, 281, 3); }
  jm2(h, 'wrist_joint', 51, 289, 4.5);
  jm2(h, 'hip_joint', 96, 280, 6);
  jm2(h, 'knee_joint', 100, 391, 6);
  jm2(h, 'ankle_joint', 100, 474, 4.6);
}

/* ---------- 関節の種類（小さな模式図を並べる） ---------- */
function arrowHead(h, x, y, deg, p){
  var a = deg * Math.PI / 180, s = 5.5, w = 3.2;
  var bx = x - Math.cos(a) * s, by = y - Math.sin(a) * s;
  var px = -Math.sin(a) * w, py = Math.cos(a) * w;
  h.path('M'+x+' '+y+' L'+(bx+px)+' '+(by+py)+' L'+(bx-px)+' '+(by-py)+' Z', {fill:'var(--ink-2)', stroke:'none'}, p);
}
function artTypes(h){
  var AR = h.S('var(--ink-2)', 1.2);

/* 筋肉B：肩・腕・手・殿部・大腿・下腿・足 */
(function(){

/* ===== 描画の小道具（このファイル専用） ===== */
var MU = 'var(--muscle)', BO = 'var(--bone)', BF = 'var(--bone-fill)', TE = 'var(--tendon)',
    BD = 'var(--body)', BE = 'var(--body-edge)', NV = 'var(--nerve)', AR = 'var(--artery)', VE = 'var(--vein)';
function r1(v){ return Math.round(v * 10) / 10; }
function P(p){ return r1(p[0]) + ' ' + r1(p[1]); }
/* 点列をなめらかにつなぐ（Catmull-Rom → 3次ベジェ。絶対座標の C だけを使う） */
function seg(a){
  var s = '';
  for(var i = 0; i < a.length - 1; i++){
    var p0 = a[i-1] || a[i], p1 = a[i], p2 = a[i+1], p3 = a[i+2] || a[i+1];
    s += ' C' + P([p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6]) + ' ' + P([p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6]) + ' ' + P(p2);
  }
  return s;
}
function crv(a){ return 'M' + P(a[0]) + seg(a); }
function loop(a){
  var n = a.length, s = 'M' + P(a[0]);
  for(var i = 0; i < n; i++){
    var p0 = a[(i-1+n)%n], p1 = a[i], p2 = a[(i+1)%n], p3 = a[(i+2)%n];
    s += ' C' + P([p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6]) + ' ' + P([p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6]) + ' ' + P(p2);
  }
  return s + ' Z';
}
function poly(a){ return 'M' + a.map(P).join(' L') + ' Z'; }
/* 背骨線 sp=[[x,y,半幅],...] を左右にずらした線（k=1 で片側の縁、0 で中心） */
function offs(sp, k){
  return sp.map(function(p, i){
    var a = sp[i-1] || p, b = sp[i+1] || p, dx = b[0]-a[0], dy = b[1]-a[1], l = Math.sqrt(dx*dx + dy*dy) || 1;
    return [p[0] - dy/l*p[2]*k, p[1] + dx/l*p[2]*k];
  });
}
function ribD(sp){ var L = offs(sp, 1), R = offs(sp, -1).reverse(); return 'M' + P(L[0]) + seg(L) + ' L' + P(R[0]) + seg(R) + ' Z'; }
function along(a, t){
  if(a.length === 1) return a[0];
  var x = t * (a.length - 1), i = Math.min(Math.floor(x), a.length - 2), f = x - i;
  return [a[i][0] + (a[i+1][0]-a[i][0])*f, a[i][1] + (a[i+1][1]-a[i][1])*f];
}
/* 線維：起始の線 A と停止の線 B を結ぶ n 本 */
function fanF(A, B, n, bx, by){
  var out = [];
  for(var j = 1; j <= n; j++){
    var t = j / (n + 1), a = along(A, t), b = along(B, t);
    out.push([a, [(a[0]+b[0])/2 + (bx || 0), (a[1]+b[1])/2 + (by || 0)], b]);

/* 筋（背骨線から）。o = {op 濃さ, fib 線維の位置, under 下地色, solid:false で透かす} */
function mus(h, ids, sp, o){
  o = o || {};
  var d = ribD(sp);
  if(o.solid !== false) h.path(d, {fill: o.under || BD, stroke:'none'});

function sheet(h, ids, d, fibs, o){
  o = o || {};
  if(o.solid !== false) h.path(d, {fill: o.under || BD, stroke:'none'});
  h.path(d, h.F(ids, MU, o.op == null ? 0.26 : o.op));

/* 折れ線にそって太さのある管の輪郭をつくる（w0→w1 に細くなる） */
function tube(pts, w0, w1){
  var L = [], R = [], n = pts.length;
  for(var i = 0; i < n; i++){
    var a = pts[Math.max(0, i-1)], b = pts[Math.min(n-1, i+1)];
    var dx = b[0]-a[0], dy = b[1]-a[1], d = Math.sqrt(dx*dx+dy*dy) || 1;
    var w = (w0 + (w1 - w0) * i / (n - 1)) / 2, nx = -dy/d*w, ny = dx/d*w;
    L.push((pts[i][0]+nx).toFixed(1)+' '+(pts[i][1]+ny).toFixed(1));
    R.push((pts[i][0]-nx).toFixed(1)+' '+(pts[i][1]-ny).toFixed(1));
  }
  return 'M'+L.join(' L')+' L'+R.reverse().join(' L')+' Z';
}

/* 3次ベジェ曲線の点と向き */
function bz(s, t){ var u = 1 - t; return [u*u*u*s[0][0] + 3*u*u*t*s[1][0] + 3*u*t*t*s[2][0] + t*t*t*s[3][0], u*u*u*s[0][1] + 3*u*u*t*s[1][1] + 3*u*t*t*s[2][1] + t*t*t*s[3][1]]; }
function segPath(segs){ var d = 'M'+segs[0][0].join(' '); segs.forEach(function(s){ d += ' C'+s[1].join(' ')+' '+s[2].join(' ')+' '+s[3].join(' '); }); return d; }
/* 曲線にそって、管を横切る短い線（結腸膨起のくびれ）の位置を求める */
function crossLines(segs, step, half){
  var d = '';
  segs.forEach(function(s){
    var n = 40, len = 0, prev = bz(s, 0), pts = [[prev, 0]];
    for(var i = 1; i <= n; i++){ var q = bz(s, i/n); len += Math.hypot(q[0]-prev[0], q[1]-prev[1]); pts.push([q, len]); prev = q; }
    for(var at = step/2; at < len; at += step){
      for(var k = 1; k < pts.length; k++) if(pts[k][1] >= at){
        var a = pts[k-1][0], b = pts[k][0], dx = b[0]-a[0], dy = b[1]-a[1], L = Math.hypot(dx, dy) || 1, nx = -dy/L*half, ny = dx/L*half;
        var c = [(a[0]+b[0])/2, (a[1]+b[1])/2];
        d += 'M'+(c[0]+nx).toFixed(1)+' '+(c[1]+ny).toFixed(1)+' Q'+(c[0]+dx/L*3).toFixed(1)+' '+(c[1]+dy/L*3).toFixed(1)+' '+(c[0]-nx).toFixed(1)+' '+(c[1]-ny).toFixed(1)+' ';
        break;
      }
    }
  });
  return d;
}

/* 臓器B：腎・泌尿器・生殖器・眼・耳・鼻と舌・皮膚・内分泌 */
(function(){
var ORG = 'var(--organ)';
function f1(v){ return Math.round(v*10)/10; }
function pt(p){ return f1(p[0]) + ' ' + f1(p[1]); }
/* 中心 o から角度 deg（画面座標、0°＝右、90°＝下）・距離 r の点 */
function pol(o, deg, r){ var a = deg*Math.PI/180; return [o[0] + r*Math.cos(a), o[1] + r*Math.sin(a)]; }
/* 点の列をなめらかな閉じた曲線に（Catmull-Rom → ベジェ） */
function smooth(ps, closed){
  var n = ps.length, d = 'M' + pt(ps[0]);
  var last = closed ? n : n - 1;
  for(var i=0;i<last;i++){
    var p0 = ps[(i-1+n)%n], p1 = ps[i], p2 = ps[(i+1)%n], p3 = ps[(i+2)%n];
    if(!closed){ if(i === 0) p0 = p1; if(i+2 >= n) p3 = p2; }
    var c1 = [p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6], c2 = [p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6];
    d += ' C' + pt(c1) + ' ' + pt(c2) + ' ' + pt(p2);
  }
  return d + (closed ? ' Z' : '');
}
/* 管（内腔を白く抜いた太い線）：外側の線→内側の白 */
function tube(h, d, w, on, col){
  col = col || ORG;
  h.path(d, {fill:'none', stroke: on ? 'var(--ink)' : col, 'stroke-width': w + (on ? 3.2 : 2.2)*h.px, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
  h.path(d, {fill:'none', stroke: on ? col : 'var(--panel)', 'stroke-opacity': on ? 0.55 : 1, 'stroke-width': w, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
}
/* 内腔（白い面）の塗り */
function lumen(h, id){
  var on = h.on(id);
  return {fill: on ? ORG : 'var(--panel)', 'fill-opacity': on ? 0.55 : 1, stroke: on ? 'var(--ink)' : ORG, 'stroke-width': (on ? 1.8 : 1.1)*h.px, 'stroke-linejoin':'round'};
}
/* 拡大図の枠と、元の場所を示す小さな四角からの引き出し線 */
function inset(h, x, y, w, hh, from){
  if(from){
    h.path('M' + from[0] + ' ' + from[1] + ' L' + x + ' ' + y + ' M' + (from[0] + from[2]) + ' ' + from[1] + ' L' + (x + w) + ' ' + y, h.S('var(--ink-2)', 0.8, {'stroke-dasharray':(3*h.px) + ' ' + (3*h.px), opacity:0.7}));
    h.rect(from[0], from[1], from[2], from[2], 1, h.S('var(--ink-2)', 1));
  }
  h.rect(x, y, w, hh, 6, {fill:'var(--panel)', stroke:'var(--ink-2)', 'stroke-width':h.px, 'stroke-opacity':0.6});
}

/* ===== 腎臓（冠状断）の形 ===== */
var KID = (function(){
  var O = [160,152], E = {cx:126, cy:152, rx:104, ry:138}, S = {rx:64, ry:70};
  function rOut(deg){
    var a = deg*Math.PI/180, dx = Math.cos(a), dy = Math.sin(a), px = O[0]-E.cx, py = O[1]-E.cy;
    var A = dx*dx/(E.rx*E.rx) + dy*dy/(E.ry*E.ry), B = 2*(px*dx/(E.rx*E.rx) + py*dy/(E.ry*E.ry)), C = px*px/(E.rx*E.rx) + py*py/(E.ry*E.ry) - 1;
    return (-B + Math.sqrt(B*B - 4*A*C)) / (2*A);
  }
  function rS(deg){ var a = deg*Math.PI/180; return 1/Math.sqrt(Math.cos(a)*Math.cos(a)/(S.rx*S.rx) + Math.sin(a)*Math.sin(a)/(S.ry*S.ry)); }
  function eP(deg){ var a = deg*Math.PI/180; return [E.cx + E.rx*Math.cos(a), E.cy + E.ry*Math.sin(a)]; }
  function sP(deg){ return pol(O, deg, rS(deg)); }
  function A(w, r){ return w/r*180/Math.PI; }   /* 半径 r で幅 w になる角度 */
  var angs = [-102,-130,-156,180,156,130,102];
  var pyr = angs.map(function(t){
    var rb = rOut(t) - 28, rs = rS(t);
    return {t:t, rb:rb, rs:rs,
      /* 錐体：外側の底（幅広）→ 先端の乳頭（腎洞に突き出す） */
      d:'M' + pt(pol(O, t-A(17,rb), rb)) + ' Q' + pt(pol(O, t, rb+6)) + ' ' + pt(pol(O, t+A(17,rb), rb)) +
        ' L' + pt(pol(O, t+A(8,rs+3), rs+3)) + ' C' + pt(pol(O, t+A(8,rs-8), rs-8)) + ' ' + pt(pol(O, t+A(4.5,rs-14), rs-14)) + ' ' + pt(pol(O, t, rs-14)) +
        ' C' + pt(pol(O, t-A(4.5,rs-14), rs-14)) + ' ' + pt(pol(O, t-A(8,rs-8), rs-8)) + ' ' + pt(pol(O, t-A(8,rs+3), rs+3)) + ' Z',
      /* 小腎杯：乳頭を受ける杯 */
      cup:'M' + pt(pol(O, t-A(10.5,rs), rs)) + ' L' + pt(pol(O, t-A(10.5,rs-14), rs-14)) + ' C' + pt(pol(O, t-A(10.5,rs-24), rs-24)) + ' ' + pt(pol(O, t-A(6,rs-27), rs-27)) + ' ' + pt(pol(O, t, rs-27)) +
        ' C' + pt(pol(O, t+A(6,rs-27), rs-27)) + ' ' + pt(pol(O, t+A(10.5,rs-24), rs-24)) + ' ' + pt(pol(O, t+A(10.5,rs-14), rs-14)) + ' L' + pt(pol(O, t+A(10.5,rs), rs)) + ' Z',
      neck:pol(O, t, rs-24), mid:pol(O, t, (rb + rs)/2), tip:pol(O, t, rs-6)};
  });
  /* 外形（腎門が右）：外側の楕円の弧（上→外側→下）、上下の唇、腎洞の壁 */
  var k, arc = [], wall = [];
  for(k=-40; k>=-320; k-=10) arc.push(eP(k));
  for(k=55; k<=305; k+=10) wall.push(sP(k));
  var arcD = arc.map(function(p, i){ return (i ? ' L' : 'M') + pt(p); }).join('');
  var up = sP(-55), lo = sP(55);
  var lipLo = ' C' + pt([eP(40)[0]+6, eP(40)[1]-12]) + ' ' + pt([lo[0]+10, lo[1]+3]) + ' ' + pt(lo);
  var lipUp = ' C' + pt([up[0]+10, up[1]-3]) + ' ' + pt([eP(-40)[0]+6, eP(-40)[1]+12]) + ' ' + pt(eP(-40));
  var wallD = wall.map(function(p){ return ' L' + pt(p); }).join('');
  return {O:O, rOut:rOut, rS:rS, eP:eP, sP:sP, pyr:pyr, up:up, lo:lo,
    capsule: 'M' + pt(up) + lipUp + arcD.replace(/^M/, ' L') + lipLo,
    lipUpD: 'M' + pt(up) + lipUp, lipLoD: 'M' + pt(eP(40)) + lipLo,
    paren: arcD + lipLo + wallD + lipUp + ' Z',
    sinus: 'M' + pt(lo) + wallD + ' Z'};
})();

/* 管・内腔をまとめて描く（外線を全部描いてから白を塗るので、つなぎ目が溶け合う）
   list: [{d, w（線の太さ・座標単位）または fill:true, id}] */
function lumens(h, list){
  list.forEach(function(o){
    var on = h.on(o.id), w = o.fill ? 0 : o.w;
    h.path(o.d, {fill: o.fill ? 'none' : 'none', stroke: on ? 'var(--ink)' : ORG, 'stroke-width': w + (on ? 3.4 : 2.4)*h.px, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
  });
  list.forEach(function(o){
    var on = h.on(o.id);
    if(o.fill) h.path(o.d, {fill: 'var(--panel)', stroke:'none'});
    else h.path(o.d, {fill:'none', stroke:'var(--panel)', 'stroke-width': o.w, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
  });
  list.forEach(function(o){
    if(!h.on(o.id)) return;
    if(o.fill) h.path(o.d, {fill: ORG, 'fill-opacity':0.55, stroke:'none'});
    else h.path(o.d, {fill:'none', stroke:ORG, 'stroke-opacity':0.55, 'stroke-width': o.w, 'stroke-linecap':'round', 'stroke-linejoin':'round'});
  });
}

function artKidney(h){
  var K = KID, O = K.O, P = K.pyr;
  /* 皮質（実質全体の地）と腎洞の脂肪 */
  h.path(K.paren, h.F('renal_cortex', ORG, 0.16));
  h.path(K.sinus, h.Fill('var(--fat)', 0.22, {'stroke-opacity':0.45}));
  /* 腎門を通る腎静脈・腎動脈（断端） */
  h.path('M250 106 L214 108 C204 109 196 112 188 116', {fill:'none', stroke:'var(--vein)', 'stroke-width':8, 'stroke-linecap':'round', 'stroke-opacity':0.7});
  h.path('M250 123 L212 124 C202 125 196 126 190 130 M200 125 C196 120 192 118 186 118', {fill:'none', stroke:'var(--artery)', 'stroke-width':4.5, 'stroke-linecap':'round', 'stroke-opacity':0.85});
  /* 腎杯・腎盂・尿管（内腔は白） */
  var L = [];
  P.forEach(function(p){ L.push({fill:true, id:'minor_calyx', d:p.cup}); });
  [[0,[152,121]],[2,[134,127]],[3,[164,152]],[4,[134,177]],[6,[152,183]]].forEach(function(q){
    L.push({w:7, id:'minor_calyx', d:'M' + pt(P[q[0]].neck) + ' L' + pt(q[1])});
  });
  L.push({w:9, id:'major_calyx', d:'M178 146 C166 128 150 120 132 122'});
  L.push({w:9, id:'major_calyx', d:'M178 158 C166 176 150 184 132 182'});
  L.push({fill:true, id:'renal_pelvis', d:'M170 130 C188 132 198 150 203 168 C206 178 207 186 203 192 C190 193 176 185 166 174 C157 164 157 140 170 130 Z'});
  L.push({w:9, id:'ureter', d:'M204 184 C212 200 228 216 236 240 C244 264 250 300 252 418'});
  lumens(h, L);
  /* 腎錐体（髄質）と縞模様 */
  P.forEach(function(p, i){
    var ids = i === 1 ? ['renal_pyramid','renal_medulla'] : 'renal_medulla';
    h.path(p.d, h.F(ids, ORG, 0.42));
    for(var s=-1; s<=1; s++){
      var a = s*8/p.rb*180/Math.PI;
      h.path('M' + pt(pol(O, p.t + a, p.rb - 4)) + ' L' + pt(pol(O, p.t + a*0.4, p.rs + 6)), h.S(ORG, 0.7, {opacity:0.5}));
    }
  });
  /* 腎乳頭（錐体の先）を強調 */
  if(h.on('renal_papilla')) P.forEach(function(p){ var c = pol(O, p.t, p.rs - 7); h.circle(c[0], c[1], 6.5, {fill:'var(--ink)', 'fill-opacity':0.4}); });
  /* 腎柱（錐体どうしのあいだの皮質）を強調 */
  if(h.on('renal_column')) for(var i=0; i<P.length-1; i++){
    var a = P[i], b = P[i+1];
    h.path('M' + pt(pol(O, a.t - 17/a.rb*180/Math.PI, a.rb)) + ' L' + pt(pol(O, a.t - 8/(a.rs+3)*180/Math.PI, a.rs + 3)) + ' L' + pt(pol(O, b.t + 8/(b.rs+3)*180/Math.PI, b.rs + 3)) + ' L' + pt(pol(O, b.t + 17/b.rb*180/Math.PI, b.rb)) + ' Z',
      {fill:ORG, 'fill-opacity':0.55, stroke:'var(--ink)', 'stroke-width':1.4*h.px, 'stroke-linejoin':'round'});
  }
  /* 被膜 */
  h.path(K.capsule, h.L('renal_capsule', ORG, 2.4));
  /* 腎門：入口の目印（点線）。選択時は入口の縁を強調 */
  var hon = h.on('renal_hilum');
  h.path('M' + pt(K.up) + ' L' + pt(K.lo), hon ? h.L('renal_hilum', ORG, 2.2) : h.S(ORG, 1, {'stroke-dasharray':(3*h.px)+' '+(3*h.px), opacity:0.6}));
  if(hon) h.path(K.lipUpD + ' ' + K.lipLoD, h.L('renal_hilum', ORG, 2.2));

  /* 拡大図：ネフロン */
  inset(h, 8, 300, 208, 116, [120, 268, 10]);
  var nOn = h.on('nephron');
  var tub = 'M68 340 C74 326 82 326 84 336 C86 348 94 348 96 336 C98 326 108 326 110 338 L111 398 C111 410 125 410 125 398 L124 356 C124 346 134 344 138 352 C142 360 150 360 152 350 C154 340 164 340 168 348 L180 348';
  h.path('M184 304 L184 412', {fill:'none', stroke:ORG, 'stroke-width':8, 'stroke-opacity':0.25, 'stroke-linecap':'round'});
  h.path(tub, h.L(['renal_tubule','nephron'], ORG, nOn || h.on('renal_tubule') ? 3.2 : 2.6));
  h.path('M14 330 C24 330 28 334 32 336 M14 350 C24 350 28 346 32 344', h.S('var(--artery)', 2.2));
  h.circle(44, 340, 24, h.F(['bowmans_capsule','nephron'], ORG, 0.12));
  h.circle(44, 340, 17, {fill:'var(--panel)', stroke:'none'});
  h.circle(42, 340, 14, h.F(['glomerulus','nephron'], 'var(--artery)', 0.28));
  ['M32 334 C36 326 46 326 48 334 C50 342 40 346 38 340','M38 348 C42 356 52 354 52 346 C52 338 44 338 46 344','M46 330 C52 324 58 332 54 338'].forEach(function(d){ h.path(d, h.S('var(--artery)', 1.1)); });
  h.text(206, 410, '拡大', {'text-anchor':'end', 'font-size':10*h.px});

function mx(d){ return mirrorPath(d); }

  n('ellipse', ext({cx:cx, cy:cy, rx:rx, ry:ry, transform: rot ? 'rotate('+rot+' '+cx+' '+cy+')' : null}, a), g);
  if(cx !== 120){ var x2 = 240 - cx; n('ellipse', ext({cx:x2, cy:cy, rx:rx, ry:ry, transform: rot ? 'rotate('+(-rot)+' '+x2+' '+cy+')' : null}, a), g); }
}

  function on(id){ return id === sel; }

  if(view === 'f'){

    n('path', ext({d:'M128 66 C131 90 127 110 129 132 C131 160 127 190 125 214'}, W('vagus', 'var(--nerve)', 1.6)), g);
    pair(g, 'M84 118 L69 198 L60 286', W('median', 'var(--nerve)', 1.6));
  } else {
    n('path', ext({d:'M120 70 L120 236'}, W('spinalcord', 'var(--nerve)', 3)), g);
    ['M120 236 L115 268','M120 236 L125 268','M120 236 L120 270'].forEach(function(d){ n('path', ext({d:d}, W('spinalcord', 'var(--nerve)', 1.2)), g); });
    for(var y=96; y<=228; y+=11) pair(g, 'M119 '+y+' L103 '+(y+7), W('spinalcord', 'var(--nerve)', 0.8));

    pair(g, 'M100 386 L95 470 M100 386 L106 470', W('sciatic', 'var(--nerve)', 1.3));

/* ---------- 描画の道具 ---------- */
var CID = 0;
function bbox(d){
  var v = d.replace(/[A-Za-z]/g, ' ').trim().split(/[\s,]+/).map(Number), x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  for(var i=0;i+1<v.length;i+=2){ x0=Math.min(x0,v[i]); x1=Math.max(x1,v[i]); y0=Math.min(y0,v[i+1]); y1=Math.max(y1,v[i+1]); }
  return [x0,y0,x1,y1];
}
function clipG(h, d){
  var id = 'hyc' + (++CID);
  var cp = h.n('clipPath', {id:id}); h.path(d, {}, cp);
  return h.group({'clip-path':'url(#'+id+')'});
}
/* 筋：面＋線維（f.a = 線維の角度、f.g = 間隔、f.fan = 扇の要 [x,y] と f.to = 広がる先） */
function musc(h, id, d, f, op){
  var col = 'var(--muscle)';
  h.path(d, h.F(id, col, op == null ? 0.22 : op));
  if(!f) return;
  var g = clipG(h, d), st = {fill:'none', stroke:col, 'stroke-width':0.7*h.px, 'stroke-opacity':0.45, 'stroke-linecap':'round'};
  if(f.fan){ f.to.forEach(function(p){ h.path('M'+f.fan[0]+' '+f.fan[1]+' L'+p[0]+' '+p[1], st, g); }); return; }
  var b = bbox(d), cx = (b[0]+b[2])/2, cy = (b[1]+b[3])/2, L = Math.hypot(b[2]-b[0], b[3]-b[1])/2 + 2;
  var a = (f.a || 0) * Math.PI/180, ux = Math.cos(a), uy = Math.sin(a), gap = f.g || 4;
  for(var o=-L; o<=L; o+=gap){
    var px = cx - uy*o, py = cy + ux*o;
    h.path('M'+(px-ux*L).toFixed(1)+' '+(py-uy*L).toFixed(1)+' L'+(px+ux*L).toFixed(1)+' '+(py+uy*L).toFixed(1), st, g);
  }
}
function tend(h, id, d){ h.path(d, h.F(id, 'var(--tendon)', 0.4)); }
function bone(h, op){ return {fill:'var(--bone-fill)', 'fill-opacity': op == null ? 1 : op, stroke:'var(--bone)', 'stroke-width':h.px, 'stroke-opacity':0.7, 'stroke-linejoin':'round'}; }
function cart(h){ return {fill:'var(--cartilage)', 'fill-opacity':0.2, stroke:'var(--cartilage)', 'stroke-width':h.px, 'stroke-opacity':0.85, 'stroke-linejoin':'round'}; }
function organ(h, op){ return {fill:'var(--organ)', 'fill-opacity': op == null ? 0.1 : op, stroke:'var(--organ)', 'stroke-width':h.px, 'stroke-opacity':0.45, 'stroke-linejoin':'round'}; }
function small(h, x, y, s, anchor){ h.text(x, y, s, {'font-size':10*h.px, 'font-family':'var(--f-jp)', 'text-anchor':anchor || 'start'}); }

    }).join('')+'</div></div>';
  }
  return '<div class="narrow stack"><div class="result"><p class="eyebrow">'+esc(modeName(q.mode))+(termMode ? '・'+rangeLabel(q.range) : '')+'</p><div class="score">'+q.score+'<small> / '+total+'</small></div><p style="margin:10px 0 0">'+msg+'</p>'+
    (q.wrong.length && termMode ? '<p class="muted" style="font-size:13px;margin:6px 0 0">まちがえた単語は単語カードの復習に入りました。</p>' : '')+'</div>'+miss+
    '<div class="btn-row"><button type="button" class="btn" data-act="qstart">もう一度（同じ設定）</button><button type="button" class="btn ghost" data-act="qsetup">設定にもどる</button>'+
    (q.wrong.length && termMode ? '<button type="button" class="btn ghost" data-act="tab" data-t="cards">カードで復習</button>' : '')+'</div></div>';
}
function qpick(k){
  var q = S.q; if(!q || q.picked !== null) return;
  var it = q.items[q.i], ok = k === it.answer;
  q.picked = k;
  if(ok) q.score++; else q.wrong.push(it);
  if(it.kind === 'en2ja' || it.kind === 'ja2en' || it.kind === 'map'){
    var st = store.stats[it.term.id] || {c:0, w:0}; if(ok) st.c++; else st.w++; store.stats[it.term.id] = st;
    if(!ok) store.cards[it.term.id] = {box:1, due:Date.now()};
    save(); renderMeter();
  }
  renderQuiz();
}
function qnext(){
  var q = S.q; if(!q) return;
  q.i++; q.picked = null;
  if(q.i >= q.items.length){ store.quiz.unshift({t:Date.now(), mode:q.mode, range:q.range, score:q.score, n:q.items.length}); store.quiz = store.quiz.slice(0, 20); save(); }
  renderQuiz(); window.scrollTo(0, 0);
}

/* ===== 単語カード ===== */
function cardQueue(){
  rollDay();
  var now = Date.now();
  function inR(t){ return S.cardRange === 'all' || t.cat === S.cardRange; }
  function due(t){ return store.cards[t.id].due; }
  var dueList = TERMS.filter(function(t){ return inR(t) && store.cards[t.id] && due(t) <= now; });
  var early = dueList.filter(function(t){ return due(t) < S.session; }).sort(function(a, b){ return due(a) - due(b); });
  var late = dueList.filter(function(t){ return due(t) >= S.session; }).sort(function(a, b){ return due(a) - due(b); });
  var unseen = TERMS.filter(function(t){ return inR(t) && !store.cards[t.id]; });
  var allow = Math.max(0, NEW_PER_DAY + store.day.extra - store.day.n);
  var fresh = unseen.slice(0, allow);
  return {queue:early.concat(fresh, late), dueN:dueList.length, freshN:fresh.length, unseenN:unseen.length};
}
function renderCards(){
  var Q = cardQueue(), t = Q.queue[0];
  var head = '<h2 class="sect">単語カード</h2><p class="lead">覚えぐあいで次に出る日が変わります（1日後 → 3日後 → 1週間後 → 2週間後 → 1か月後）。新しい単語は1日'+NEW_PER_DAY+'枚まで。</p>'+
    '<div class="cardbar"><div class="seg" role="group" aria-label="表に出す面"><button type="button" data-act="cdir" data-d="en" aria-pressed="'+(S.cardDir==='en')+'">英 → 日</button><button type="button" data-act="cdir" data-d="ja" aria-pressed="'+(S.cardDir==='ja')+'">日 → 英</button></div>'+
    '<div class="counts"><div><b>'+Q.dueN+'</b>復習</div><div><b>'+Q.freshN+'</b>新しい単語</div></div></div>'+
    '<div class="ranges" style="margin-bottom:12px">'+rangeChips('crange', S.cardRange)+'</div>';
  var body;
  if(!t){
    body = '<div class="done"><h3>今日の分はおわりました</h3><p class="muted" style="margin:0 0 14px;font-size:13.5px">'+(Q.unseenN ? 'この範囲には、まだ見ていない単語が'+Q.unseenN+'枚あります。' : 'この範囲の単語は、すべて学習を始めています。')+'</p>'+
      (Q.unseenN ? '<button type="button" class="btn" data-act="cmore">新しい単語をあと'+Math.min(NEW_PER_DAY, Q.unseenN)+'枚</button>' : '')+'</div>';
  } else {
    var c = store.cards[t.id], box = c ? c.box : 0, cat = CAT[t.cat], nb = Math.min(5, box + 1);
    var front = S.cardDir === 'en' ? '<div class="fl-main latin">'+esc(t.en)+'</div>'+spkBtn(t.en) : '<div class="fl-main">'+esc(t.ja)+'</div>';
    var back = '<div class="fl-hint">タップで答えを表示</div>';
    if(S.flipped){
      back = '<div class="fl-back">'+
        (S.cardDir === 'en' ? '<div class="tp-ja" style="margin:0">'+esc(t.ja)+(t.yomi ? '<small>'+esc(t.yomi)+'</small>' : '')+'</div>'
                            : '<div class="fb-term" style="margin:0"><span class="latin" style="font-size:30px;font-weight:600">'+esc(t.en)+'</span>'+spkBtn(t.en, true)+'</div>')+
        '<div class="tp-pron">発音 <span class="k">'+kanaHTML(t.kana)+'</span>'+(t.alt ? ' <span class="tp-alt">＝ '+esc(t.alt)+'</span>' : '')+'</div>'+
        '<p style="margin:8px 0 0">'+esc(t.ety)+'</p>'+
        '<div class="ex" style="margin-top:10px"><div style="min-width:0;flex:1"><p class="ex-en" style="margin:0">'+esc(t.ex[0])+'</p><p class="ex-ja" style="margin-bottom:0">'+esc(t.ex[1])+'</p></div>'+spkBtn(t.ex[0], true)+'</div></div>';
    }
    body = '<div class="flash" role="button" tabindex="0" data-act="flip" aria-label="カードをめくる" style="--c:'+cat.c+'"><span class="fl-cat"><i></i>'+cat.ja+'</span><span class="fl-box">'+(box ? '段階 '+box : 'NEW')+'</span>'+front+back+'</div>'+
      (S.flipped ? '<div class="grades"><button type="button" class="grade again" data-act="grade" data-g="again"><b>もう一度</b><small>このあとすぐ</small></button>'+
        '<button type="button" class="grade" data-act="grade" data-g="hard"><b>あいまい</b><small>明日</small></button>'+
        '<button type="button" class="grade good" data-act="grade" data-g="good"><b>覚えた</b><small>'+(INTERVAL[nb] === 1 ? '明日' : INTERVAL[nb]+'日後')+'</small></button></div>' : '');
  }
  var counts = [0,0,0,0,0,0];
  TERMS.forEach(function(x){ var cc = store.cards[x.id]; counts[cc ? cc.box : 0]++; });
  var boxes = '<div class="boxes" aria-label="段階ごとの枚数">'+counts.map(function(k, i){ return '<div><b>'+k+'</b>'+(i ? '段階'+i : '未学習')+'</div>'; }).join('')+'</div>';
  $('#v-cards').innerHTML = '<div class="narrow">'+head+body+boxes+'</div>';
}
function grade(g){
  var t = cardQueue().queue[0]; if(!t) return;
  var c = store.cards[t.id], box = c ? c.box : 0, nb, due, s = startOfDay();
  if(g === 'again'){ nb = 1; due = Date.now(); }
  else if(g === 'hard'){ nb = Math.max(1, box); due = s + DAY; }
  else { nb = Math.min(5, box + 1); due = s + INTERVAL[nb] * DAY; }
  if(!c) store.day.n++;
  store.cards[t.id] = {box:nb, due:due};
  save(); S.flipped = false; renderCards(); renderMeter();
}
function flip(){
  S.flipped = !S.flipped; renderCards();
  var f = document.querySelector('.flash'); if(f) try { f.focus({preventScroll:true}); } catch(e){}
}

/* ===== 語源タブ ===== */
function renderRoots(){
  var q = S.rootQuery.trim().toLowerCase();
  var list = ROOTS.filter(function(r){ return !q || (r.r+' '+r.m+' '+r.o+' '+r.w.map(function(w){ return w.join(' '); }).join(' ')).toLowerCase().indexOf(q) >= 0; });
  $('#rootsGrid').innerHTML = list.length ? list.map(function(r){
    return '<article class="root-card'+(S.rootFocus === r.id ? ' focus' : '')+'" id="root-'+r.id+'">'+
      '<div class="rc-head"><span class="rc-r">'+esc(r.r)+'</span><span class="rc-m">'+esc(r.m)+'</span></div>'+
      '<div class="rc-o">'+esc(r.o)+'</div>'+
      '<ul class="rc-w">'+r.w.map(function(w){ return '<li><span class="latin">'+esc(w[0])+'</span>'+esc(w[1])+'</li>'; }).join('')+'</ul>'+
      (r.note ? '<p class="rc-note">'+esc(r.note)+'</p>' : '')+
      (r.terms.length ? '<div class="rc-terms">'+r.terms.map(function(id){ return '<button type="button" class="term-chip" data-act="sel" data-id="'+id+'">'+esc(TERM[id].en)+'<small>'+esc(TERM[id].ja)+'</small></button>'; }).join('')+'</div>' : '')+
      '</article>';
  }).join('') : '<p class="empty">「'+esc(S.rootQuery)+'」に合う語根はありません。</p>';
}

/* ===== タブ切り替え ===== */
function setTab(t){
  S.tab = t;
  ['atlas','quiz','cards','roots'].forEach(function(k){ $('#v-'+k).hidden = k !== t; });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){ if(b.getAttribute('data-t') === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if(t === 'atlas') renderAtlas();
  if(t === 'quiz') renderQuiz();
  if(t === 'cards'){ S.session = Date.now(); S.flipped = false; renderCards(); }
  if(t === 'roots') renderRoots();
  window.scrollTo(0, 0);
}

/* ===== 操作 ===== */
document.addEventListener('click', function(e){
  var say = e.target.closest('[data-say]');
  if(say){ speak(say.getAttribute('data-say')); return; }
  var mk = e.target.closest('.mk[data-id]');
  if(mk && mk.closest('#atlasSvg')){ select(mk.getAttribute('data-id')); return; }
  var a = e.target.closest('[data-act]'); if(!a) return;
  var act = a.getAttribute('data-act');
  switch(act){
    case 'tab': setTab(a.getAttribute('data-t')); break;
    case 'cat': setCat(a.getAttribute('data-c')); break;
    case 'plate': setPlate(a.getAttribute('data-p')); break;
    case 'goplate': setPlate(a.getAttribute('data-p')); showPlate(); break;
    case 'sel':
      select(a.getAttribute('data-id'));
      if(S.tab !== 'atlas') setTab('atlas'); else showPlate();
      break;
    case 'root':
      S.rootFocus = a.getAttribute('data-r'); S.rootQuery = ''; $('#rootSearch').value = '';
      setTab('roots');
      var el = document.getElementById('root-'+S.rootFocus); if(el) el.scrollIntoView({block:'center'});
      break;
    case 'qmode': S.quizMode = a.getAttribute('data-m'); renderQuiz(); break;
    case 'qrange': S.quizRange = a.getAttribute('data-v'); renderQuiz(); break;
    case 'qstart': S.q = buildQuiz(S.quizMode, S.quizRange); renderQuiz(); window.scrollTo(0, 0); break;
    case 'qpick': qpick(a.getAttribute('data-k')); break;
    case 'qnext': qnext(); break;
    case 'qquit': case 'qsetup': S.q = null; renderQuiz(); window.scrollTo(0, 0); break;
    case 'cdir': S.cardDir = a.getAttribute('data-d'); S.flipped = false; renderCards(); break;
    case 'crange': S.cardRange = a.getAttribute('data-v'); S.flipped = false; renderCards(); break;
    case 'flip': flip(); break;
    case 'grade': grade(a.getAttribute('data-g')); break;
    case 'cmore': rollDay(); store.day.extra += NEW_PER_DAY; save(); renderCards(); break;
  }
});
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' && e.key !== ' ') return;
  var tg = e.target; if(!tg || !tg.closest) return;
  var mk = tg.closest('.mk[data-id]');
  if(mk && mk.closest('#atlasSvg')){
    e.preventDefault(); var id = mk.getAttribute('data-id'); select(id);
    var m = document.querySelector('#atlasSvg .mk[data-id="'+id+'"]'); if(m) try { m.focus(); } catch(err){}
    return;
  }
  if(tg.classList && tg.classList.contains('flash')){ e.preventDefault(); flip(); }
});
$('#rootSearch').addEventListener('input', function(e){ S.rootQuery = e.target.value; S.rootFocus = null; renderRoots(); });
var lastW = window.innerWidth, rt = null;
window.addEventListener('resize', function(){
  if(Math.abs(window.innerWidth - lastW) < 20) return;
  lastW = window.innerWidth; clearTimeout(rt);
  rt = setTimeout(function(){ if(S.tab === 'atlas') renderAtlas(); }, 200);
});

/* ===== LINE（LIFF）===== LIFF ID が設定されているときだけ SDK を読み込む */
(function(){
  var id = window.LIFF_ID; if(!id) return;
  var s = document.createElement('script');
  s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
  s.onload = function(){ if(window.liff) window.liff.init({liffId:id}).catch(function(err){ console.warn('LIFF init failed', err); }); };
  document.head.appendChild(s);
})();

renderMeter();
setTab('atlas');
})();

</script>
</body>
